name: Fetch photo library
# Downloads CC0 / public-domain photos from Openverse into photos/library/.
# Runs when photos/queries.txt changes, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['photos/queries.txt', 'tools/fetch_photos.py']
permissions:
  contents: write
concurrency:
  group: fetch-photos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/fetch_photos.py
      - name: Commit new photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/library
          if git diff --cached --quiet; then echo "No new photos"; exit 0; fi
          git commit -m "Add photos to library"
          git pull --rebase origin main
          git push origin main
